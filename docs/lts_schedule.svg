<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .axis-label { font-size: 12px; font-weight: 600; fill: #64748B; text-anchor: middle; }
    .track-title { font-size: 13px; font-weight: 700; fill: #E2E8F0; text-anchor: end; }
    .bar-text { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
    .legend-text { font-size: 12px; font-weight: 500; fill: #CBD5E1; }
    .marker-text { font-size: 11px; font-weight: 700; fill: #00D2FF; text-anchor: middle; }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="960" height="400" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="24" y="24" width="8" height="28" rx="4" fill="url(#brandGrad)"/>
  <text x="42" y="38" class="title">Go Runtime Lifecycle &amp; Support Schedule</text>
  <text x="42" y="55" class="subtitle">XYO Financial Enterprise SDK • 3-Month Proactive LTS Sunset Policy</text>

  <!-- Grid & Timeline Axis (2024 - 2027) -->
  <!-- Origin X: 160, Width: 760 -> Range: Jan 2024 to Dec 2027 (48 months => ~15.83px/mo) -->
  <g transform="translate(170, 85)">
    <!-- Vertical Grid Lines -->
    <line x1="0" y1="0" x2="0" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="0" y="-10" class="axis-label">2024</text>

    <line x1="190" y1="0" x2="190" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="190" y="-10" class="axis-label">2025</text>

    <line x1="380" y1="0" x2="380" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="380" y="-10" class="axis-label">2026</text>

    <line x1="570" y1="0" x2="570" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="570" y="-10" class="axis-label">2027</text>

    <line x1="750" y1="0" x2="750" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="750" y="-10" class="axis-label">2028</text>

    <!-- Version Tracks -->
    <!-- Go 1.22 (Feb 2024 - Feb 2025) -->
    <text x="-20" y="24" class="track-title">Go 1.22</text>
    <rect x="31" y="8" width="159" height="24" rx="6" fill="#475569" opacity="0.85"/>
    <text x="38" y="24" class="bar-text">Supported Baseline Floor (EOL Upstream)</text>

    <!-- Go 1.23 (Aug 2024 - Aug 2025) -->
    <text x="-20" y="64" class="track-title">Go 1.23</text>
    <rect x="110" y="48" width="190" height="24" rx="6" fill="#F59E0B" opacity="0.85"/>
    <text x="118" y="64" class="bar-text">Maintenance (Sunset Transition)</text>

    <!-- Go 1.24 (Feb 2025 - Feb 2026) -->
    <text x="-20" y="104" class="track-title">Go 1.24</text>
    <rect x="205" y="88" width="190" height="24" rx="6" fill="#10B981"/>
    <text x="213" y="104" class="bar-text">Active Upstream Support</text>

    <!-- Go 1.25 (Aug 2025 - Aug 2026) -->
    <text x="-20" y="144" class="track-title">Go 1.25</text>
    <rect x="300" y="128" width="190" height="24" rx="6" fill="#10B981"/>
    <text x="308" y="144" class="bar-text">Active Upstream Support</text>

    <!-- Go 1.26 (Feb 2026 - Feb 2027) -->
    <text x="-20" y="184" class="track-title">Go 1.26</text>
    <rect x="395" y="168" width="190" height="24" rx="6" fill="#00D2FF" opacity="0.9"/>
    <text x="403" y="184" class="bar-text" fill="#0F172A">Current Major Release (Target)</text>

    <!-- Current Time Milestone Indicator (Mid 2026: ~x=475) -->
    <line x1="475" y1="-25" x2="475" y2="225" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="470,-25 480,-25 475,-15" fill="#00D2FF"/>
    <text x="475" y="-30" class="marker-text">CURRENT (2026)</text>
  </g>

  <!-- Legend Section -->
  <g transform="translate(60, 345)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#10B981"/>
    <text x="22" y="12" class="legend-text">Active Upstream Release</text>

    <rect x="220" y="0" width="14" height="14" rx="3" fill="#00D2FF"/>
    <text x="242" y="12" class="legend-text">Current Recommended Target</text>

    <rect x="470" y="0" width="14" height="14" rx="3" fill="#F59E0B"/>
    <text x="492" y="12" class="legend-text">3-Month Proactive Sunset Window</text>

    <rect x="740" y="0" width="14" height="14" rx="3" fill="#475569"/>
    <text x="762" y="12" class="legend-text">Minimum SDK Floor (Legacy)</text>
  </g>
</svg>
