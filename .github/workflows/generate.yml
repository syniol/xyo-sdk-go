name: Regenerate Go OpenAPI Client

on:
  repository_dispatch:
    # specs only ever emits spec_tagged; see xyo-financial/specs#12
    types: [spec_tagged]
  workflow_dispatch:
    inputs:
      spec_tag:
        description: 'Tag or branch in xyo-financial/specs to generate from'
        required: false
        default: 'main'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4

      - name: Checkout OpenAPI specification
        uses: actions/checkout@v4
        with:
          repository: xyo-financial/specs
          ref: ${{ github.event.client_payload.tag || inputs.spec_tag || 'main' }}
          path: specs

      - name: Set up Node.js (for openapi-generator-cli)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Generate OpenAPI Go client
        run: |
          npx -y @openapitools/openapi-generator-cli@2.13.0 generate \
            -i specs/openapi.yml \
            -g go \
            -o openapi \
            --additional-properties=packageName=openapi,withGoMod=false,hideGenerationTimestamp=true,disallowAdditionalPropertiesIfNotPresent=false \
            --global-property apiTests=false,modelTests=false,apiDocs=false,modelDocs=false

          # Remove generator noise files
          rm -f openapi/git_push.sh \
                openapi/.travis.yml \
                openapi/README.md
          rm -rf openapi/test \
                 openapi/docs \
                 openapi/api

          # The generator does not gofmt its output, but the committed tree is gofmt clean, so a raw
          # regeneration diff is dominated by lost struct-field alignment and stray blank lines rather
          # than by anything from the specification. Formatting here keeps regeneration diffs readable.
          gofmt -w openapi/

          # Clean up specs checkout so it is not committed
          rm -rf specs

      - name: Build and vet the Golang SDK
        run: |
          go build ./...
          go vet ./...
          go test -v ./...

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SDK_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate OpenAPI client from spec ${{ github.event.client_payload.tag || inputs.spec_tag || 'latest' }}"
          title: "Automated SDK Update"
          body: "This PR automatically updates the generated Go client based on OpenAPI spec ${{ github.event.client_payload.tag || inputs.spec_tag || 'latest' }}."
          branch: "chore/auto-update-sdk"
          delete-branch: true
